# Pilot/shared deployment: copy .env.example to .env and set JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD.
# AUTH_ENABLED defaults to true so the app can bind to 0.0.0.0 safely (see startupSafety).
services:
  app:
    build: .
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - app-data:/app/data
      - ./config/dimbuilder.yaml:/app/config/dimbuilder.yaml:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_FILE=/app/data/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
